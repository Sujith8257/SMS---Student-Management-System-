                      "secondary": "#625d5b",
                      "surface": "#f9f9f7",
                      "on-secondary-fixed": "#1e1b19",
                      "on-error-container": "#93000a",
                      "tertiary-container": "#73756f",
                      "secondary-fixed": "#e9e1dd",
                      "outline-variant": "#e1bfbb",
                      "inverse-surface": "#2f3130",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-card {
            background: #FBFAF9;
            border: 1px solid #E7E6E5;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
        .stagger-5 { animation-delay: 0.5s; opacity: 0; }
        .stagger-6 { animation-delay: 0.6s; opacity: 0; }
      </style>
</head>
<body class="bg-[#F7F7F5] min-h-screen flex flex-col antialiased text-on-surface relative z-0">

<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center relative z-10 p-margin-mobile md:p-margin-desktop min-h-screen">
<!-- Registration Card -->
<div class="glass-card w-full max-w-md p-6 sm:p-10 relative z-10 transition-all duration-300 animate-fade-in-up">
<div class="text-center mb-8 flex flex-col items-center animate-fade-in stagger-1">
<!-- Logo mark concept inline -->
<div class="w-16 h-16 bg-[#FDF5F4] rounded-full flex items-center justify-center mb-4 text-[#e4544b]">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 0;">school</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-on-surface mb-1">Create Your Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join the Student Management System</p>
</div>
<form class="space-y-6" id="signUpForm" onsubmit="event.preventDefault(); handleSignUp();">
<!-- Username -->
<div class="animate-fade-in stagger-2">
<label class="block font-label-eyebrow text-label-eyebrow text-on-surface mb-2 uppercase sr-only" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full h-12 pl-12 pr-4 rounded-full bg-white border border-outline-variant/60 text-on-surface font-body-md placeholder-on-surface-variant/50 focus:border-[#e4544b] focus:ring focus:ring-[#e4544b]/20 focus:bg-white transition-all outline-none" id="username" name="username" placeholder="Username" required="" type="text">
</div>
</div>
<!-- Password -->
<div class="animate-fade-in stagger-3">
<label class="block font-label-eyebrow text-label-eyebrow text-on-surface mb-2 uppercase sr-only" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full h-12 pl-12 pr-4 rounded-full bg-white border border-outline-variant/60 text-on-surface font-body-md placeholder-on-surface-variant/50 focus:border-[#e4544b] focus:ring focus:ring-[#e4544b]/20 focus:bg-white transition-all outline-none" id="password" name="password" placeholder="Password" required="" type="password">
</div>
</div>
<!-- Confirm Password -->
<div class="animate-fade-in stagger-4">
<label class="block font-label-eyebrow text-label-eyebrow text-on-surface mb-2 uppercase sr-only" for="confirm-password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-70" style="font-variation-settings: 'FILL' 0;">verified_user</span>
<input class="w-full h-12 pl-12 pr-4 rounded-full bg-white border border-outline-variant/60 text-on-surface font-body-md placeholder-on-surface-variant/50 focus:border-[#e4544b] focus:ring focus:ring-[#e4544b]/20 focus:bg-white transition-all outline-none" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required="" type="password">
</div>
</div>
<!-- Validation Message -->
<div class="hidden bg-error-container/80 backdrop-blur-sm text-on-error-container font-body-md text-sm p-3 rounded-xl border border-error/20 flex items-center gap-2" id="error-message">
<span class="material-symbols-outlined text-[18px]">error</span>
<span class="" id="error-text">Passwords do not match.</span>
</div>
<!-- Primary Action -->
<div class="animate-fade-in stagger-5 mt-8">
<button class="w-full h-12 bg-[#e4544b] text-white font-button-text text-button-text rounded-full flex justify-center items-center gap-2 hover:bg-[#c94139] hover:shadow-[0_0_15px_rgba(228,84,75,0.4)] hover:scale-[1.02] transition-all duration-200 active:scale-[0.98]" type="submit">
<span class="">Sign Up</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Secondary Link -->
<div class="mt-8 text-center animate-fade-in stagger-6">
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors duration-200" href="index.html">
                    Already have an account? <span class="font-semibold text-on-surface">Sign In</span>
</a>
</div>
</div>
</main>

<script>
    function handleSignUp() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const errorContainer = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const submitBtn = document.querySelector('button[type="submit"]');

        errorContainer.classList.add('hidden');

        if (password !== confirmPassword) {
            errorContainer.classList.remove('hidden');
            errorText.textContent = "Passwords do not match.";
            return;
        }

        // Simulate loading state
        const originalText = submitBtn.innerHTML;
        submitBtn.innerHTML = `<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span> <span>Creating Account...</span>`;
        submitBtn.disabled = true;
        submitBtn.classList.add('opacity-80', 'cursor-not-allowed', 'scale-100', 'hover:scale-100', 'hover:shadow-none');
        
        setTimeout(() => {
            // Save mock user in localStorage
            localStorage.setItem('sms_mock_user_' + username, JSON.stringify({username, password}));
            // Redirect to sign in page
            window.location.href = 'index.html?registered=true';
        }, 1500);
    }
</script>
</body>
</html>
