<script src="js/app.js"></script>
<script>
    // Navigation Drawer Toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenuBtn && mobileMenu) {
        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    }

    // Modal Overlay Toggle
    const modal = document.getElementById('registerModal');
    function openRegisterModal(editId = null) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        
        if (editId) {
            document.getElementById('modalTitle').textContent = "Edit Student Profile";
            const student = window.SMS.getStudent(editId);
            if (student) {
                document.getElementById('studentId').value = student.id;
                document.getElementById('regName').value = student.name;
                document.getElementById('regEmail').value = student.email;
                document.getElementById('regPhone').value = student.phone;
                document.getElementById('regDept').value = student.dept;
                const genderVal = student.gender;
                const genderRadio = document.querySelector(`input[name="regGender"][value="${genderVal}"]`);
                if (genderRadio) {
                    genderRadio.checked = true;
                }
                
                // Format DOB from DD-MM-YYYY to YYYY-MM-DD for input[type="date"]
                const dobParts = student.dob.split('-');
                if (dobParts.length === 3) {
                    document.getElementById('regDOB').value = `${dobParts[2]}-${dobParts[1]}-${dobParts[0]}`;
                }
                modal.dataset.editId = editId;
            }
        } else {
            document.getElementById('modalTitle').textContent = "Register Student";
            document.getElementById('registerForm').reset();
            document.getElementById('studentId').value = "";
            delete modal.dataset.editId;
        }
    }

    function closeRegisterModal() {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function submitRegistration() {
        const id = document.getElementById('studentId').value;
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const phone = document.getElementById('regPhone').value;
        const dept = document.getElementById('regDept').value;
        const gender = document.querySelector('input[name="regGender"]:checked')?.value || 'Male';
        const dobInput = document.getElementById('regDOB').value;
        
        // Format DOB from YYYY-MM-DD to DD-MM-YYYY
        const dobParts = dobInput.split('-');
        const dob = `${dobParts[2]}-${dobParts[1]}-${dobParts[0]}`;
        
        const studentData = { name, email, phone, dept, gender, dob };
        
        if (id) {
            window.SMS.updateStudent(id, studentData);
        } else {
            window.SMS.addStudent(studentData);
        }
        
        renderTable();
        closeRegisterModal();
    }

    function deleteStudentEntry(id) {
        if (confirm("Are you sure you want to delete this student record?")) {
            window.SMS.deleteStudent(id);
            renderTable();
        }
    }

    function renderTable(filterQuery = "") {
        const tbody = document.getElementById('studentTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        
        const query = filterQuery.toLowerCase().trim();
        const students = window.SMS.getStudents();
        
        const filtered = students.filter(student => {
            return student.name.toLowerCase().includes(query) || 
                   student.email.toLowerCase().includes(query) || 
                   student.dept.toLowerCase().includes(query);
        });
        
        if (filtered.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="py-8 text-center text-on-surface-variant text-sm font-medium">
                        No student records found.
                    </td>
                </tr>
            `;
            document.getElementById('entriesText').textContent = `Showing 0 to 0 of 0 entries`;
            return;
        }
        
        filtered.forEach((student, index) => {
            const isEven = index % 2 === 1;
            const rowClass = isEven ? 'bg-panel' : 'bg-surface-bright';
            
            const tr = document.createElement('tr');
            tr.className = `hover:bg-surface-container-low transition-colors ${rowClass}`;
            tr.innerHTML = `
                <td class="py-4 px-4 md:px-5 font-medium">${student.name}</td>
                <td class="py-4 px-4 md:px-5 hidden sm:table-cell">${student.email}</td>
                <td class="py-4 px-4 md:px-5 hidden md:table-cell">${student.phone}</td>
                <td class="py-4 px-4 md:px-5">
                    <span class="bg-primary/10 text-primary px-3 py-1.5 rounded-full text-xs font-semibold">${student.dept}</span>
                </td>
                <td class="py-4 px-4 md:px-5 hidden sm:table-cell">${student.gender}</td>
                <td class="py-4 px-4 md:px-5 hidden md:table-cell">${student.dob}</td>
                <td class="py-4 px-4 md:px-5">
                    <div class="flex gap-2 justify-center">
                        <button onclick="openRegisterModal(${student.id})" class="bg-success text-white px-3 md:px-4 py-1.5 rounded-full font-button-text text-xs md:text-button-text hover:shadow-md transition-shadow flex items-center justify-center min-w-[60px] md:min-w-[72px]">
                            Edit
                        </button>
                        <button onclick="deleteStudentEntry(${student.id})" class="bg-error text-white px-3 md:px-4 py-1.5 rounded-full font-button-text text-xs md:text-button-text hover:shadow-md transition-shadow flex items-center justify-center min-w-[60px] md:min-w-[72px]">
                            Delete
                        </button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
        
        document.getElementById('entriesText').textContent = `Showing 1 to ${filtered.length} of ${students.length} entries`;
    }

    // Attach listeners and initial load
    document.addEventListener('DOMContentLoaded', () => {
        // Initial table load
        renderTable();
        
        // Search bar functionality
        const searchBar = document.getElementById('searchBar');
        if (searchBar) {
            searchBar.addEventListener('input', () => {
                renderTable(searchBar.value);
            });
        }
        
        // Check for register action
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('action') === 'register') {
            openRegisterModal();
        }

        // Update profile picture placeholder with first letter
        const username = localStorage.getItem('sms_current_user') || 'Admin';
        const profilePic = document.getElementById('userProfilePic');
        if (profilePic && username.trim().length > 0) {
            profilePic.textContent = username.trim()[0].toUpperCase();
        }

        // Form Validation Rules: Email format & Phone number exactly 10 digits
        const emailInput = document.getElementById('regEmail');
        if (emailInput) {
            emailInput.addEventListener('input', () => {
                const val = emailInput.value.trim();
                const emailPattern = /^[a-zA-Z0-9._%+-]+@klu\.ac\.in$/;
                if (!emailPattern.test(val)) {
                    emailInput.setCustomValidity('Email address must end with @klu.ac.in (e.g. 99220041389@klu.ac.in).');
                } else {
                    emailInput.setCustomValidity('');
                }
            });
        }

        const phoneInput = document.getElementById('regPhone');
        if (phoneInput) {
            phoneInput.addEventListener('input', () => {
                const val = phoneInput.value.trim();
                // Matches optional country code (+91, 91, or 0) followed by exactly 10 digits
                const phonePattern = /^(\+91|91|0)?[6-9]\d{9}$/;
                if (!phonePattern.test(val)) {
                    phoneInput.setCustomValidity('Please enter a valid 10-digit phone number (e.g. +919876543210, 9876543210).');
                } else {
                    phoneInput.setCustomValidity('');
                }
            });
        }
    });
</script>
